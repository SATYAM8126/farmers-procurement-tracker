<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIH26032 — Unified Demo Dashboard</title>
<style>
    :root {
        --bg-dark: #0f172a;
        --bar-bg: #111827;
        --bar-border: #263043;
        --text-light: #f8fafc;
        --text-muted: #cbd5e1;
        --accent-green: #22c55e;
        --accent-green-bg: rgba(34,197,94,.16);
        --focus-ring: #60a5fa;
    }

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, Arial, sans-serif;
        background: var(--bg-dark);
        height: 100vh;
        display: flex;
        flex-direction: column;
        color: var(--text-light);
    }

    /* Visible focus outline everywhere, for keyboard users */
    a:focus-visible,
    button:focus-visible,
    select:focus-visible,
    iframe:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
        border-radius: 4px;
    }

    .skip-link {
        position: absolute;
        left: -9999px;
        top: auto;
        background: #fff;
        color: #111;
        padding: 10px 16px;
        border-radius: 6px;
        z-index: 2000;
        font-weight: 700;
        text-decoration: none;
    }

    .skip-link:focus {
        left: 12px;
        top: 12px;
    }

    header.dash-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 22px;
        background: var(--bar-bg);
        border-bottom: 1px solid var(--bar-border);
        color: var(--text-light);
        flex-wrap: wrap;
    }

    .dash-topbar-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }

    .dash-topbar-left .emblem {
        font-size: 24px;
        flex-shrink: 0;
    }

    .dash-title-block {
        min-width: 0;
    }

    .dash-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .dash-subtitle {
        font-size: 12.5px;
        color: var(--text-muted);
        margin-top: 2px;
    }

    .dash-switch {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    .dash-switch-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .dash-switch-label span {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--text-muted);
    }

    #viewSelector {
        padding: 10px 16px;
        border-radius: 8px;
        border: 1.5px solid #374151;
        background: #1f2937;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
        min-width: 190px;
    }

    #viewSelector:hover {
        border-color: #4b5563;
    }

    .dash-status {
        font-size: 13px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--accent-green-bg);
        color: #6ee7a0;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }

    .dash-status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-green);
        flex-shrink: 0;
        animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .4; }
    }

    @media (prefers-reduced-motion: reduce) {
        .dash-status .dot { animation: none; }
    }

    main.dash-frame-wrap {
        flex: 1;
        position: relative;
        background: #f4f5f7;
    }

    main.dash-frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
    }

    .dash-loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f4f5f7;
        color: #4b5563;
        font-size: 15px;
        font-weight: 600;
        transition: opacity .2s ease;
        pointer-events: none;
    }

    .dash-loading.hidden {
        opacity: 0;
    }

    .dash-spinner {
        width: 34px;
        height: 34px;
        border: 3.5px solid #d1d5db;
        border-top-color: #166534;
        border-radius: 50%;
        animation: spin .8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
        .dash-spinner { animation: none; }
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0,0,0,0);
        white-space: nowrap;
        border: 0;
    }

    @media (max-width: 640px) {
        header.dash-topbar {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .dash-switch {
            width: 100%;
            justify-content: space-between;
        }

        #viewSelector {
            min-width: 0;
            flex: 1;
        }
    }
</style>
</head>
<body>

<a href="#dashFrame" class="skip-link">Skip to main content</a>

<header class="dash-topbar">
    <div class="dash-topbar-left">
        <div class="emblem" role="img" aria-label="Indian flag emblem">🇮🇳</div>
        <div class="dash-title-block">
            <div class="dash-title">SIH26032 — Farmer Procurement Queue Tracker</div>
            <div class="dash-subtitle">Unified demo view · Ministry of Consumer Affairs, Food &amp; Public Distribution</div>
        </div>
    </div>

    <div class="dash-switch">
        <div class="dash-status" role="status">
            <span class="dot" aria-hidden="true"></span>
            <span>Live backend</span>
        </div>

        <div class="dash-switch-label">
            <span id="viewSelectorLabel">Viewing as</span>
            <select id="viewSelector" aria-labelledby="viewSelectorLabel" onchange="switchView(this.value)">
                <option value="farmer.html" selected>👨‍🌾 Farmer</option>
                <option value="operator.html">🧑‍💼 Centre Operator</option>
            </select>
        </div>
    </div>
</header>

<main class="dash-frame-wrap">
    <div class="dash-loading" id="dashLoading" role="status" aria-live="polite">
        <div class="dash-spinner" aria-hidden="true"></div>
        <span>Loading view…</span>
    </div>
    <iframe id="dashFrame" src="farmer.html" title="Application view: Farmer Dashboard"></iframe>
</main>

<div id="viewAnnouncer" class="sr-only" role="status" aria-live="polite"></div>

<script>
    const frame = document.getElementById("dashFrame");
    const loading = document.getElementById("dashLoading");
    const selector = document.getElementById("viewSelector");
    const announcer = document.getElementById("viewAnnouncer");

    const viewLabels = {
        "farmer.html": "Farmer Dashboard",
        "operator.html": "Centre Operator Dashboard"
    };

    // Remember last-viewed screen across reloads, purely for demo convenience.
    const savedView = sessionStorage.getItem("spt_dashboard_view");
    if (savedView && viewLabels[savedView]) {
        selector.value = savedView;
        frame.src = savedView;
    }

    function switchView(page) {
        loading.classList.remove("hidden");
        sessionStorage.setItem("spt_dashboard_view", page);
        frame.src = page;
        frame.title = "Application view: " + (viewLabels[page] || "App view");
        announcer.textContent = "Switched to " + (viewLabels[page] || "new view");
    }

    frame.addEventListener("load", () => {
        loading.classList.add("hidden");
    });
</script>

</body>
</html>
