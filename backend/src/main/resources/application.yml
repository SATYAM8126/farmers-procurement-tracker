server:
  port: 8080

spring:
  application:
    name: procurement-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/procurement
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
